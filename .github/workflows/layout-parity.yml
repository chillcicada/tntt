name: LaTeX layout parity
on:
  pull_request:
    paths: [".github/workflows/layout-parity.yml", "src/**", "tests/visual/**", "template/**"]
  workflow_dispatch:
jobs:
  prepare-fonts:
    name: Prepare Typst fonts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Download open fonts
        run: make -C template fonts
      - uses: actions/upload-artifact@v7
        with:
          name: typst-fonts
          path: template/fonts
          if-no-files-found: error
          retention-days: 1
  layout-parity:
    name: ${{ matrix.degree }}-${{ matrix.language }}-${{ matrix.output }}
    needs: prepare-fonts
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        degree: [bachelor, master, doctor, postdoc]
        language: [chinese, english]
        output: [electronic, print]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: tuna/thuthesis
          ref: b50ce596c248964fe04f317a8fe9b1a0f6b34174
          path: latex-reference
      - name: Install container dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends poppler-utils python3-pil xz-utils
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - uses: actions/download-artifact@v8
        with:
          name: typst-fonts
          path: template/fonts
      - name: Build LaTeX reference in TeX Live
        run: |
          mkdir -p build/latex
          cd latex-reference
          xelatex -interaction=batchmode thuthesis.ins
          if [ "${{ matrix.language }}" = chinese ]; then
            source=main.tex
          else
            source=main-en.tex
          fi
          case="${{ matrix.degree }}-${{ matrix.language }}-${{ matrix.output }}"
          input="\\PassOptionsToClass{degree=${{ matrix.degree }},degree-type=academic,language=${{ matrix.language }},thesis-type=thesis,style-override=none,fontset=fandol}{thuthesis}\\def\\CompareOutput{${{ matrix.output }}}\\input{${GITHUB_WORKSPACE}/tests/visual/$source}"
          xelatex -halt-on-error -interaction=batchmode -file-line-error \
            -output-directory="${GITHUB_WORKSPACE}/build/latex" \
            -jobname="$case" \
            "$input"
          (
            cd "${GITHUB_WORKSPACE}/build/latex"
            BIBINPUTS="${GITHUB_WORKSPACE}/latex-reference:" \
              BSTINPUTS="${GITHUB_WORKSPACE}/latex-reference:" \
              bibtex "$case"
          )
          for _ in 1 2; do
            xelatex -halt-on-error -interaction=batchmode -file-line-error \
              -output-directory="${GITHUB_WORKSPACE}/build/latex" \
              -jobname="$case" \
              "$input"
          done
      - name: Compile Typst and generate diff
        run: |
          case="${{ matrix.degree }}-${{ matrix.language }}-${{ matrix.output }}"
          if [ "${{ matrix.language }}" = chinese ]; then
            source=main.typ
          else
            source=main-en.typ
          fi
          if [ "${{ matrix.output }}" = print ]; then
            twoside=true
          else
            twoside=false
          fi
          mkdir -p build/typst
          typst compile --root . --font-path template/fonts \
            --input degree=${{ matrix.degree }} \
            --input degree-type=academic \
            --input twoside="$twoside" \
            "template/$source" "build/typst/$case.pdf"
          python3 tests/visual/check.py \
            "build/latex/$case.pdf" \
            "build/typst/$case.pdf" \
            "build/diff/$case.pdf"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: layout-parity-diff-${{ matrix.degree }}-${{ matrix.language }}-${{ matrix.output }}
          path: build/diff/*.pdf
          if-no-files-found: warn
          retention-days: 1
  merge-diffs:
    name: Merge layout diffs
    needs: layout-parity
    if: ${{ !cancelled() && needs.layout-parity.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge diff artifacts
        id: merge
        uses: actions/upload-artifact/merge@v7
        with:
          name: layout-parity-diffs
          pattern: layout-parity-diff-*
          delete-merged: true
          retention-days: 7
          compression-level: 0
      - name: Add artifact links to summary
        env:
          GITHUB_ARTIFACT_URL: ${{ steps.merge.outputs.artifact-url }}
        run: |
          {
            echo '## Layout parity diffs'
            echo
            echo 'LaTeX-only content is green, Typst-only content is red, and matching content is black.'
            echo
            echo "[Download artifact]($GITHUB_ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
