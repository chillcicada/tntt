name: LaTeX layout parity
on:
  pull_request:
    paths: [".github/workflows/layout-parity.yml", "src/**", "tests/visual/**", "template/**"]
  workflow_dispatch:
jobs:
  layout-parity:
    name: ${{ matrix.degree }}-${{ matrix.language }}-${{ matrix.output }}
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        degree: [bachelor, master, doctor, postdoc]
        language: [chinese, english]
        output: [electronic, print]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: tuna/thuthesis
          ref: b50ce596c248964fe04f317a8fe9b1a0f6b34174
          path: latex-reference
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - name: Install layout comparison tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends poppler-utils python3-pil
      - name: Prepare Typst fonts
        run: make -C template fonts
      - name: Build LaTeX reference in TeX Live
        run: |
          mkdir -p build/latex
          cd latex-reference
          xelatex -interaction=batchmode thuthesis.ins
          input="\\PassOptionsToClass{degree=${{ matrix.degree }},degree-type=academic,language=${{ matrix.language }},thesis-type=thesis,style-override=none,fontset=fandol}{thuthesis}\\def\\CompareOutput{${{ matrix.output }}}\\input{${GITHUB_WORKSPACE}/tests/visual/cases.tex}"
          for pass in 1 2; do
            xelatex -halt-on-error -interaction=batchmode -file-line-error \
              -output-directory="${GITHUB_WORKSPACE}/build/latex" \
              -jobname="${{ matrix.degree }}-${{ matrix.language }}-${{ matrix.output }}" \
              "$input"
          done
      - name: Compile Typst and compare
        run: |
          case="${{ matrix.degree }}-${{ matrix.language }}-${{ matrix.output }}"
          mkdir -p build/typst
          typst compile --root . --font-path template/fonts \
            --input degree=${{ matrix.degree }} \
            --input degree-type=academic \
            --input language=${{ matrix.language }} \
            --input output=${{ matrix.output }} \
            --input thesis-type=thesis \
            --input style-override=none \
            tests/visual/cases.typ "build/typst/$case.pdf"
          python3 tests/visual/check.py "$case" \
            "build/latex/$case.pdf" \
            "build/typst/$case.pdf" \
            --max-mae 0.01 --min-iou 0.63
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: layout-parity-${{ matrix.degree }}-${{ matrix.language }}-${{ matrix.output }}
          path: build
          if-no-files-found: warn
          retention-days: 7
