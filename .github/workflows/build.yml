name: Render nightly thesis
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "template/**"
  pull_request:
    types: [opened, edited, synchronize]
    paths:
      - "src/**"
      - "template/**"
  workflow_dispatch:
jobs:
  render-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - name: Prepare open fonts
        run: make -C template FONT_DIR=../fonts fonts
      - name: Render templates
        run: |
          typst compile --root . --font-path fonts template/main.typ main.pdf
          typst compile --root . --font-path fonts template/main-en.typ main-en.pdf
      - name: Upload Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: thesis
          path: |
            main.pdf
            main-en.pdf
